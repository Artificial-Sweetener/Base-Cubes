name: SugarSubstitute input-asset contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-asset-contract:
    name: SugarSubstitute canary contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Base-Cubes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout SugarSubstitute canary contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Artificial-Sweetener/SugarSubstitute
          ref: canary
          path: contract/SugarSubstitute
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Validate input-asset contracts
        working-directory: contract/SugarSubstitute
        shell: pwsh
        run: python -m tools.check_input_asset_contracts $env:GITHUB_WORKSPACE
